name: Web version (GitHub Pages)

# Manual only: GitHub Pages is not enabled for this repository yet (it needs a public
# repository or a paid plan). Once it is, run this from the Actions tab, or add a
# push trigger on main for web/** to deploy automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node web/test.mjs

      - name: Stage site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm _site/test.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
